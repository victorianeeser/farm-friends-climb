<!doctype html>
<!-- Local helper for design previews: loads sample stats, then opens the screen named after "#" (stats, leaderboard).
     An optional best score can follow, e.g. #leaderboard:2000. -->
<meta charset="utf-8">
<script>
  const [screen, best] = location.hash.slice(1).split(':');
  localStorage.setItem('ffc.best', best || '612');
  localStorage.setItem('ffc.stats', JSON.stringify({ runs: 27, totalFt: 6340, byCharacter: { piglet: 11, sheep: 9, duck: 7 }, byCause: { fall: 12, crow: 6, butterfly: 5, gust: 3, owl: 1 } }));
  location.replace('../index.html#' + (screen || 'stats'));
</script>
